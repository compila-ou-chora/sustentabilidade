spring.application.name=sustentabilidade

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rm562294}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.flyway.baseline-on-migrate=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.error.include-stacktrace=never

minha.chave.secreta=${JWT_SECRET:sustentabilidade-api-secret}

# Actuator - usado para health checks no Docker e no pipeline de CI/CD
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
